name: CI — validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate contracts, IaC, UI, API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bicep
        run: az bicep install

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # --- API ---
      - name: Install API deps
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: API unit tests
        run: python -m pytest api/tests -q

      # --- UI ---
      - name: Install UI deps
        run: npm ci --prefix ui

      - name: UI build
        run: npm run build --prefix ui

      # --- Data / Power BI generators ---
      - name: Tokenomics generator tests
        run: node scripts/tokenomics/test/generate-data.test.mjs
        continue-on-error: true

      # --- IaC: Bicep build + lint ---
      - name: Bicep build & lint
        run: |
          for f in bicep/apim/service.bicep bicep/apim/main.bicep bicep/ui/main.bicep \
                   bicep/tokenomics-data/main.bicep bicep/pricing-function/main.bicep; do
            echo "== $f =="
            az bicep build --file "$f" --stdout > /dev/null
            az bicep lint --file "$f"
          done

      # --- IaC: Terraform validate ---
      - name: Terraform validate
        run: |
          for d in terraform/apim terraform/ui terraform/tokenomics-data \
                   terraform/network-apim-side terraform/pricing-function; do
            echo "== $d =="
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" fmt -check
            terraform -chdir="$d" validate
          done

      # --- Ontology model (dry run, no Fabric auth needed) ---
      - name: Ontology model what-if
        run: python scripts/deploy-fabric-ontology.py --what-if
