name: Deploy — UI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for approvals and secrets
        type: string
        default: production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy UI
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment configuration
        id: config
        shell: pwsh
        run: |
          $config = Get-Content config/deployment.json -Raw | ConvertFrom-Json
          "resource_group=$($config.azure.resourceGroup)" >> $env:GITHUB_OUTPUT
          "app_name=$($config.ui.appName)" >> $env:GITHUB_OUTPUT
          "production_url=$($config.ui.productionUrl)" >> $env:GITHUB_OUTPUT

      - name: Build UI deployment package
        shell: pwsh
        run: ./scripts/build-ui-package.ps1

      - name: Enforce UI reliability settings
        shell: pwsh
        run: |
          $appId = "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ steps.config.outputs.resource_group }}/providers/Microsoft.Web/sites/${{ steps.config.outputs.app_name }}"
          az resource update `
            --ids "$appId/config/web" `
            --api-version 2023-12-01 `
            --set properties.alwaysOn=true properties.healthCheckPath=/health properties.healthCheckEvictionTimeInMin=5 `
            --only-show-errors `
            --output none

      - name: Publish UI
        run: |
          az webapp deploy \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --resource-group "${{ steps.config.outputs.resource_group }}" \
            --name "${{ steps.config.outputs.app_name }}" \
            --src-path .generated/packages/fabric-costops-ui.zip \
            --type zip \
            --async false \
            --clean true \
            --restart true \
            --timeout 300000 \
            --only-show-errors \
            --output none

      - name: Verify UI health
        shell: pwsh
        run: |
          $healthUrl = "${{ steps.config.outputs.production_url }}/health"
          $videoUrl = "${{ steps.config.outputs.production_url }}/assets/videos/01-platform-overview.mp4"
          $healthy = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $health = Invoke-RestMethod -Method Get -Uri $healthUrl -TimeoutSec 30
              if ($health.status -eq 'ok') {
                Write-Host "UI health check passed."
                $healthy = $true
                break
              }
            }
            catch {
              Write-Warning "Health check attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $healthy) {
            throw "UI health check failed after deployment: $healthUrl"
          }

          $video = Invoke-WebRequest -Method Head -Uri $videoUrl -TimeoutSec 30
          $contentType = [string]$video.Headers.'Content-Type'
          $contentLength = [long]([string]$video.Headers.'Content-Length')
          if ($contentType -ne 'video/mp4' -or $contentLength -lt 1MB) {
            throw "Showcase video verification failed: $videoUrl returned $contentType with $contentLength bytes."
          }
          Write-Host "Showcase video verification passed ($contentLength bytes)."
